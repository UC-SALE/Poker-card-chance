<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a10">
<title>Poker 2 Card Odds</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,system-ui,sans-serif;background:#06140d;color:#fff}
.screen{position:absolute;top:0;left:0;width:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;max-width:600px;margin:auto;background:radial-gradient(circle at 50% 10%,#24623f,#0b2d1d 45%,#06140d);visibility:hidden;opacity:0;transition:opacity 0.2s ease}
.screen:not(.hidden){visibility:visible;opacity:1;z-index:10}
.title{position:absolute;top:calc(env(safe-area-inset-top) + 20px);font-size:25px;font-weight:900}
.info{position:absolute;top:calc(env(safe-area-inset-top) + 62px);font-size:14px;color:#b5cdbd}
.suits{width:min(92vw,450px);display:grid;grid-template-columns:1fr 1fr;gap:16px}
.suit{height:min(34vw,185px);min-height:125px;border:0;border-radius:24px;background:#fff;color:#111;font-size:clamp(70px,20vw,110px);box-shadow:0 12px 28px #0009;cursor:pointer}
.red{color:#d72537!important}
.suit:active,.rank:active,.back:active{transform:scale(.94)}
.ranks{width:min(92vw,500px);display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rank{height:clamp(58px,14vw,82px);border:0;border-radius:16px;background:#17472f;color:#fff;font-size:clamp(22px,6vw,34px);font-weight:900;box-shadow:0 5px 12px #0006;cursor:pointer}
.back{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);border:1px solid #ffffff25;border-radius:13px;padding:11px 22px;background:#ffffff12;color:#d1e0d6;font-size:15px;cursor:pointer}
.cards{display:flex;gap:13px;margin-bottom:18px}
.card{width:92px;height:125px;background:#fff;color:#111;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 25px #0009}
.card.red{color:#d72537}.cr{font-size:31px;font-weight:900}.cs{font-size:42px}
.resultbox{width:min(90vw,430px);padding:20px;background:#071b11;border:1px solid #2d704a;border-radius:22px;text-align:center}
.big{font-size:62px;font-weight:950;color:#6df2a0}.muted{font-size:12px;color:#a5bdb0}
.stat{text-align:left;margin-top:13px}.top{display:flex;justify-content:space-between;font-size:12px}.bar{height:8px;background:#ffffff14;border-radius:9px;margin-top:4px}.fill{height:100%;background:#59dd8e;border-radius:9px}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- 1-р картын масть -->
<div id="screenSuit1" class="screen">
  <div class="title">♠ POKER ODDS</div>
  <div class="info">1-р картын масть сонго</div>
  <div class="suits">
    <button type="button" class="suit" data-step="1" data-suit="♠">♠</button>
    <button type="button" class="suit red" data-step="1" data-suit="♥">♥</button>
    <button type="button" class="suit" data-step="1" data-suit="♣">♣</button>
    <button type="button" class="suit red" data-step="1" data-suit="♦">♦</button>
  </div>
</div>

<!-- 1-р картын rank -->
<div id="screenRank1" class="screen hidden">
  <div class="title">1-Р КАРТ</div>
  <div class="info">A · K · Q · J · 10 ... сонго</div>
  <div id="ranks1" class="ranks"></div>
  <button type="button" class="back" data-back="suit1">← Буцах</button>
</div>

<!-- 2-р картын масть -->
<div id="screenSuit2" class="screen hidden">
  <div class="title">♠ POKER ODDS</div>
  <div class="info">2-р картын масть сонго</div>
  <div id="card1" class="cards"></div>
  <div class="suits">
    <button type="button" class="suit" data-step="2" data-suit="♠">♠</button>
    <button type="button" class="suit red" data-step="2" data-suit="♥">♥</button>
    <button type="button" class="suit" data-step="2" data-suit="♣">♣</button>
    <button type="button" class="suit red" data-step="2" data-suit="♦">♦</button>
  </div>
  <button type="button" class="back" data-back="rank1">← Буцах</button>
</div>

<!-- 2-р картын rank -->
<div id="screenRank2" class="screen hidden">
  <div class="title">2-Р КАРТ</div>
  <div class="info">Тоо / дүрсээ сонго</div>
  <div id="card2" class="cards"></div>
  <div id="ranks2" class="ranks"></div>
  <button type="button" class="back" data-back="suit2">← Буцах</button>
</div>

<!-- Үр дүн -->
<div id="screenResult" class="screen hidden">
  <div class="title">♠ POKER ODDS</div>
  <div id="finalCards" class="cards"></div>
  <div class="resultbox">
    <div id="big" class="big">Тооцож байна...</div>
    <div class="muted">WIN PROBABILITY</div>
    <div class="stat"><div class="top"><span>Win</span><b id="wp">—</b></div><div class="bar"><div id="wf" class="fill"></div></div></div>
    <div class="stat"><div class="top"><span>Tie</span><b id="tp">—</b></div><div class="bar"><div id="tf" class="fill"></div></div></div>
    <div class="stat"><div class="top"><span>Lose</span><b id="lp">—</b></div><div class="bar"><div id="lf" class="fill"></div></div></div>
  </div>
  <button type="button" class="back" data-back="reset">↺ Дахин сонгох</button>
</div>

<script>
const RANKS=["A","K","Q","J","10","9","8","7","6","5","4","3","2"];
let hand=[];
let firstSuit="";
let secondSuit="";

function screen(id){
  document.querySelectorAll(".screen").forEach(x=>{
    x.classList.add("hidden");
    x.style.zIndex = "0";
  });
  const target = document.getElementById(id);
  if(target){
    target.classList.remove("hidden");
    target.style.zIndex = "10";
  }
}

// Эхлэх дэлгэцийг идэвхжүүлэх
screen("screenSuit1");

function makeRanks(id,num){
  const box=document.getElementById(id);
  box.innerHTML = "";
  RANKS.forEach(r=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="rank";
    b.textContent=r;
    b.addEventListener("click",function(e){
      e.preventDefault();
      if(num===1) chooseRank1(r); else chooseRank2(r);
    });
    box.appendChild(b);
  });
}
makeRanks("ranks1",1);
makeRanks("ranks2",2);

document.querySelectorAll(".suit").forEach(b=>{
  b.addEventListener("click",function(e){
    e.preventDefault();
    const step=this.getAttribute("data-step");
    const suit=this.getAttribute("data-suit");
    if(step==="1"){
      firstSuit=suit;
      screen("screenRank1");
    }else{
      secondSuit=suit;
      document.getElementById("card2").innerHTML=cardHTML(hand[0]);
      screen("screenRank2");
    }
  });
});

function chooseRank1(r){
  hand=[{r:r,s:firstSuit}];
  document.getElementById("card1").innerHTML=cardHTML(hand[0]);
  screen("screenSuit2");
}

function chooseRank2(r){
  if(hand.length!==1)return;
  const c={r:r,s:secondSuit};
  if(c.r===hand[0].r && c.s===hand[0].s)return;
  hand.push(c);
  document.getElementById("finalCards").innerHTML=cardHTML(hand[0])+cardHTML(hand[1]);
  screen("screenResult");
  setTimeout(calculate,30);
}

function cardHTML(c){
  if(!c)return "";
  const red=(c.s==="♥"||c.s==="♦")?" red":"";
  return '<div class="card'+red+'"><div class="cr">'+c.r+'</div><div class="cs">'+c.s+'</div></div>';
}

document.querySelectorAll(".back").forEach(b=>{
  b.addEventListener("click",function(){
    const to=this.getAttribute("data-back");
    if(to==="reset"){hand=[];firstSuit="";secondSuit="";screen("screenSuit1")}
    else if(to==="suit1")screen("screenSuit1");
    else if(to==="rank1")screen("screenRank1");
    else if(to==="suit2")screen("screenSuit2");
  });
});

function value(r){return r==="A"?14:r==="K"?13:r==="Q"?12:r==="J"?11:Number(r)}

function evaluate(cards){
  const count={};
  cards.forEach(c=>count[c.r]=(count[c.r]||0)+1);
  const groups=Object.keys(count).map(r=>({v:value(r),n:count[r]})).sort((a,b)=>b.n-a.n||b.v-a.v);
  function straight(arr){
    let u=[...new Set(arr.map(value))].sort((a,b)=>b-a);
    if(u.includes(14))u.push(1);
    for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4)return u[i];
    return 0;
  }
  for(const s of ["♠","♥","♣","♦"]){
    const f=cards.filter(c=>c.s===s);
    if(f.length>=5){const st=straight(f);if(st)return[8,st]}
  }
  const q=groups.find(x=>x.n===4);
  if(q)return[7,q.v,...groups.filter(x=>x.v!==q.v).map(x=>x.v)];
  const tr=groups.filter(x=>x.n>=3), pairs=groups.filter(x=>x.n>=2);
  if(tr.length>=2)return[6,tr[0].v,tr[1].v];
  if(tr.length&&pairs.some(x=>x.v!==tr[0].v))return[6,tr[0].v,pairs.find(x=>x.v!==tr[0].v).v];
  for(const s of ["♠","♥","♣","♦"]){
    const f=cards.filter(c=>c.s===s);
    if(f.length>=5)return[5,...f.map(c=>value(c.r)).sort((a,b)=>b-a).slice(0,5)];
  }
  const st=straight(cards);if(st)return[4,st];
  if(tr.length)return[3,tr[0].v,...groups.filter(x=>x.v!==tr[0].v).map(x=>x.v).slice(0,2)];
  const p=groups.filter(x=>x.n===2);
  if(p.length>=2)return[2,p[0].v,p[1].v,...groups.filter(x=>x.n===1).map(x=>x.v).slice(0,1)];
  if(p.length)return[1,p[0].v,...groups.filter(x=>x.v!==p[0].v).map(x=>x.v).slice(0,3)];
  return[0,...groups.map(x=>x.v).slice(0,5)];
}

function compare(a,b){
  for(let i=0;i<Math.max(a.length,b.length);i++){
    const x=a[i]||0,y=b[i]||0;
    if(x!==y)return x>y?1:-1;
  }
  return 0;
}

function calculate(){
  const suits=["♠","♥","♣","♦"];
  const deck=[];
  for(const r of RANKS)for(const s of suits)deck.push({r,s});
  const known=new Set(hand.map(c=>c.r+c.s));
  const available=deck.filter(c=>!known.has(c.r+c.s));
  let win=0,tie=0,lose=0;
  const N=30000;

  for(let n=0;n<N;n++){
    const pool=available.slice();
    const draw=[];
    for(let k=0;k<7;k++){
      const idx=Math.floor(Math.random()*pool.length);
      draw.push(pool.splice(idx,1)[0]);
    }
    const opp=draw.slice(0,2),board=draw.slice(2);
    const z=compare(evaluate(hand.concat(board)),evaluate(opp.concat(board)));
    if(z>0)win++;else if(z<0)lose++;else tie++;
  }
  const W=win/N*100,T=tie/N*100,L=lose/N*100;
  document.getElementById("big").textContent=W.toFixed(1)+"%";
  document.getElementById("wp").textContent=W.toFixed(1)+"%";
  document.getElementById("tp").textContent=T.toFixed(1)+"%";
  document.getElementById("lp").textContent=L.toFixed(1)+"%";
  document.getElementById("wf").style.width=W+"%";
  document.getElementById("tf").style.width=T+"%";
  document.getElementById("lf").style.width=L+"%";
}
</script>
</body>
</html>
